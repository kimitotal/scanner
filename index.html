<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pallet Scan Check</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f5fa8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  /* Phone-first: sticky order header on top, one tab of content, tab bar fixed at the bottom */
  :root {
    --bg: #f3f5f7; --surface: #ffffff; --fg: #15202b; --muted: #5b6b7a; --line: #cfd8e0; --accent: #1f5fa8;
    --ok: #c9efd2; --ok-fg: #0f5223; --warn: #ffe7a3; --warn-fg: #6a4b00; --bad: #ffc4c4; --bad-fg: #7a1010;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
    --side: max(16px, env(safe-area-inset-left, 0px));
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #1a222b; --fg: #e6edf3; --muted: #93a3b3; --line: #2e3a46; --accent: #6ea8ec;
    --ok: #17402a; --ok-fg: #a8e8bb; --warn: #4a3a0c; --warn-fg: #ffe08a; --bad: #4d1a1a; --bad-fg: #ffb3b3; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #11171d; --surface: #1a222b; --fg: #e6edf3; --muted: #93a3b3; --line: #2e3a46; --accent: #6ea8ec;
    --ok: #17402a; --ok-fg: #a8e8bb; --warn: #4a3a0c; --warn-fg: #ffe08a; --bad: #4d1a1a; --bad-fg: #ffb3b3; color-scheme: dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; -webkit-tap-highlight-color: transparent;
    padding: 0 var(--side) calc(80px + env(safe-area-inset-bottom, 0px)); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  input, select, button, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  /* not radios/checkboxes: a 100%-wide hidden radio widened the page and pushed the tab bar off screen */
  input:where(:not([type=radio], [type=checkbox])), select { min-height: 48px; padding: 10px 12px; width: 100%; font-size: 16px; }
  button, .btn { min-height: 48px; padding: 10px 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
  .btn { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  button.primary, .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.big, .btn.big { min-height: 56px; font-size: 18px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { font: 13px var(--mono); width: 100%; padding: 10px; margin: 8px 0; }
  .mono { font-family: var(--mono); }
  .hint { color: var(--muted); font-size: 14px; }
  .stack { display: grid; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
  details > summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 8px 0; min-height: 40px; }

  /* header */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 calc(-1 * var(--side)) 12px;
    padding: max(10px, env(safe-area-inset-top, 0px)) var(--side) 10px; border-bottom: 1px solid var(--line); }
  .t1 { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  #orderName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stats { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok-fg); transition: width .3s; }

  /* bottom tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabs button { border: 0; border-radius: 0; background: none; min-height: 60px; padding: 8px 2px 6px; font-size: 12px; color: var(--muted);
    flex-direction: column; gap: 3px; position: relative; }
  nav.tabs button[aria-current="page"] { color: var(--accent); }
  nav.tabs svg { width: 24px; height: 24px; }
  .badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 20px; padding: 1px 6px; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }

  /* scan tab */
  .palrow { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  .palrow label { flex: 1; }
  #pallet { font: 500 20px var(--mono); }
  #dimBtn { white-space: nowrap; }
  #dimBtn.set { color: var(--ok-fg); }
  #dimBox { margin-bottom: 10px; }
  #live { margin-top: 10px; border-radius: 12px; overflow: hidden; position: relative; background: #000; }
  /* portrait phone video is very tall; crop to a short band so the result stays on screen */
  #live video { display: block; width: 100%; height: 34vh; object-fit: cover; }
  #live::after { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; border-top: 2px solid rgba(255, 60, 60, .8); }
  #zoomBox { flex-direction: row; align-items: center; gap: 10px; margin-top: 8px; }
  #zoomBox input { flex: 1; min-height: 32px; padding: 0; }
  #result { font-size: 20px; font-weight: 700; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
    margin: 10px 0 8px; overflow-wrap: anywhere; white-space: pre-line; min-height: 64px; }
  #result.ok { background: var(--ok); color: var(--ok-fg); border-color: transparent; }
  #result.over { background: var(--warn); color: var(--warn-fg); border-color: transparent; }
  #result.bad { background: var(--bad); color: var(--bad-fg); border-color: transparent; }
  #result.done { font-size: 24px; outline: 3px solid var(--ok-fg); }
  #fix { display: grid; gap: 8px; }
  #fix:not(:empty) { margin-bottom: 8px; }
  #raw { margin-bottom: 10px; overflow-wrap: anywhere; }
  .scanrow { display: flex; gap: 8px; }
  #scan { flex: 1; min-width: 0; font: 500 18px var(--mono); }
  #sugg { display: grid; gap: 6px; margin-top: 8px; }
  #sugg button { display: block; text-align: left; font: 400 14px var(--sans); padding: 10px 12px; overflow-wrap: anywhere; }
  #sugg button b { font-family: var(--mono); }
  #sugg .done { opacity: .6; }
  #camTools { margin-top: 12px; }
  #camTools .stack { padding-top: 4px; }

  /* lines tab */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chips label { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; min-height: 40px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label:has(:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chips label:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  #orders { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .ord { font: 500 13px var(--mono); padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
  .ord.ok { background: var(--ok); color: var(--ok-fg); border-color: transparent; }
  .line { display: grid; gap: 4px; overflow-wrap: anywhere; }
  .line.ok { background: var(--ok); color: var(--ok-fg); border-color: transparent; }
  .line.ok .hint { color: inherit; opacity: .8; }
  .l1 { display: flex; gap: 10px; align-items: baseline; }
  .l1 > b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .l1 > span { white-space: nowrap; }
  .line label { flex-direction: row; align-items: center; gap: 8px; margin-top: 4px; color: inherit; font-size: 14px; }
  .palIn { width: 9em; min-height: 40px; padding: 6px 10px; font: 500 15px var(--mono); }

  /* pallets tab */
  .dims { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .dims input { padding: 8px; font: 500 16px var(--mono); text-align: center; }
  .pcard { display: grid; gap: 10px; }
  .tag { font-size: 13px; font-weight: 600; color: var(--ok-fg); }
  .tag.warn { color: var(--warn-fg); background: var(--warn); padding: 2px 8px; border-radius: 6px; }
  .plines { margin: 0; padding-left: 22px; font-size: 14px; display: grid; gap: 4px; }

  /* history tab */
  .hrow { display: flex; gap: 8px; align-items: center; }
  .hrow > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .hrow.ok { background: var(--ok); color: var(--ok-fg); border-color: transparent; }
  .hrow.ok .hint { color: inherit; }

  #toast { position: fixed; left: var(--side); right: var(--side); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    background: var(--fg); color: var(--bg); padding: 12px 14px; border-radius: 10px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #reader { display: none; }

  /* printed pallet content lists: only #print shows on paper, one pallet per page */
  #print { display: none; }
  @media print {
    @page { margin: 12mm; }
    body { background: #fff !important; color: #000 !important; padding: 0 !important; font-size: 10pt; }
    body > *:not(#print) { display: none !important; }
    #print { display: block; }
    .plist { break-after: page; }
    .plist:last-child { break-after: auto; }
    .plist h1 { font-size: 22pt; margin: 0 0 2mm; }
    .plist .meta { margin-bottom: 2mm; }
    .plist .dimline { font-size: 13pt; font-weight: 700; margin-bottom: 4mm; }
    .plist table { border-collapse: collapse; width: 100%; font-size: 9.5pt; }
    .plist th, .plist td { border: 0.5pt solid #000; padding: 1.5mm 2mm; text-align: left; white-space: normal; background: none !important; color: #000 !important; }
    .plist thead { display: table-header-group; }
    .plist tr { break-inside: avoid; }
    .plist .sign { margin-top: 10mm; display: flex; gap: 20mm; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="t1"><span id="orderName"></span><span id="stats"></span></div>
  <div class="bar"><i id="barFill"></i></div>
</header>

<main>
<section id="tab-scan">
  <div class="palrow">
    <label class="f">Current pallet<input id="pallet" list="palList" placeholder="PLT-01" autocomplete="off" enterkeyhint="done"></label>
    <button id="dimBtn" aria-expanded="false">Size / weight</button>
  </div>
  <datalist id="palList"></datalist>
  <div id="dimBox" class="card" hidden></div>
  <div class="row2">
    <button class="primary big" id="liveBtn">Start camera</button>
    <button class="big" id="photoBtn">Photo scan</button>
  </div>
  <input type="file" id="photo" accept="image/*" capture="environment" hidden>
  <div id="live" hidden><video id="vid" playsinline muted></video></div>
  <label class="f" id="zoomBox" hidden>Zoom <span id="zoomVal">1×</span><input type="range" id="zoom" min="1" max="1" step="0.1" value="1"></label>
  <div id="result" role="status">Example order loaded. Load your own in the History tab.</div>
  <div id="fix"></div>
  <div id="raw" class="hint"></div>
  <div class="scanrow">
    <input id="scan" placeholder="Type batch, serial, label or part no." autocomplete="off" enterkeyhint="go" aria-label="Batch, serial, label or part number">
    <button id="go">Check</button>
  </div>
  <div id="sugg"></div>
  <details id="camTools" hidden><summary>Camera settings</summary>
    <div class="stack"><label class="f">Camera<select id="camSel"></select></label><div id="camInfo" class="hint"></div></div>
  </details>
</section>

<section id="tab-lines" hidden>
  <input id="find" type="search" placeholder="Search part, batch, description, order, pallet…" autocomplete="off" aria-label="Search all lines">
  <div class="chips" role="radiogroup" aria-label="Show">
    <label><input type="radio" name="flt" value="" checked>All</label>
    <label><input type="radio" name="flt" value="todo">Not scanned</label>
    <label><input type="radio" name="flt" value="done">Scanned</label>
  </div>
  <div id="orders"></div>
  <p id="findInfo" class="hint"></p>
  <div id="lines" class="stack"></div>
</section>

<section id="tab-pallets" hidden>
  <div class="row2">
    <button id="printAll">Print all lists</button>
    <button id="palXlsx">Export Excel</button>
  </div>
  <h2>Pallets</h2>
  <div id="pallets" class="stack"></div>
</section>

<section id="tab-hist" hidden>
  <h2>Load new order</h2>
  <div class="card stack">
    <label class="btn primary big">Choose order file (Excel or CSV)<input type="file" id="file" hidden></label>
    <details id="pasteBox"><summary>Or paste order rows</summary>
      <textarea id="paste" rows="5" placeholder="Copy the rows (with the header row) from Excel or the CSV and paste here" aria-label="Order rows"></textarea>
      <button id="pasteGo">Load pasted rows</button>
    </details>
    <span class="hint">The current order and its scans are kept below.</span>
  </div>
  <h2>Current order</h2>
  <div class="card stack">
    <div id="curInfo"></div>
    <label class="f">Part number column<select id="colPart"></select></label>
    <label class="f">Batch / serial column<select id="colAlt"></select></label>
    <div class="row2"><button id="export">Export CSV</button><button id="reset">Clear scans</button></div>
  </div>
  <h2>Earlier orders</h2>
  <p id="histInfo" class="hint"></p>
  <div id="hist" class="stack"></div>
  <p class="hint">Everything is saved on this phone only. Export before switching phones or clearing browser data.</p>
</section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="scan" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>Scan</button>
  <button data-tab="lines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Lines<span class="badge" id="badge" hidden></span></button>
  <button data-tab="pallets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg>Pallets</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
</nav>

<div id="toast" role="status" hidden></div>
<div id="reader"></div>
<section id="print"></section>

<script>
const $ = id => document.getElementById(id);
const EXAMPLE = {
  headers: ['Part Number', 'Description', 'Qty'],
  rows: [
    { 'Part Number': 'D5323-1', Description: 'Brake assembly (example)', Qty: 2 },
    { 'Part Number': 'MS21042L3', Description: 'Nut, self-locking (example)', Qty: 50 },
    { 'Part Number': '2315M20-3', Description: 'Hose assembly (example)', Qty: 1 },
  ],
  partCol: 'Part Number', qtyCol: 'Qty', scans: {},
};
let S = structuredClone(EXAMPLE);
let tab = 'scan';
const save = () => { try { localStorage.setItem('scanState', JSON.stringify(S)); } catch {} };
try { const s = JSON.parse(localStorage.getItem('scanState')); if (s && s.rows) S = s; } catch {}
// orders saved by an older version lack newer column picks; fill them in so no reload is needed
{
  const guess = re => S.headers.find(h => re.test(h)) || '';
  S.orderCol ??= guess(/^order\s*no/i); S.posCol ??= guess(/^pos/i); S.labelCol ??= guess(/label/i);
}

const norm = s => String(s ?? '').toUpperCase().replace(/[\s\-\/\.]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Batch/serial no. pins one exact line, so try it first; then Label No.; then part no.
// Labels add a prefix: "LB" before Label No. ("LB2134060"), "1P"/"P"/"S" per ATA Spec 2000.
// Every column gets the code as scanned before any column gets it stripped.
function findRows(code) {
  const tries = [norm(code)];
  const m = norm(code).match(/^(?:LB|1P|P|S)(.+)$/);
  if (m) tries.push(m[1]);
  for (const t of tries) {
    if (t === '0') continue; // Label No. is "0" on unlabelled lines
    // serialised parts carry the Label No. on their barcode; it pins the line like a batch no. does
    for (const col of [S.altCol, S.labelCol, S.partCol].filter(Boolean)) {
      const hits = S.rows.map((r, i) => i).filter(i => norm(S.rows[i][col]) === t);
      if (hits.length) return Object.assign(hits, { byBatch: col !== S.partCol });
    }
  }
  return [];
}
// One scan = the whole line is there (a batch label covers the whole bag); quantities aren't counted.
const isDone = i => !!S.scans[i]?.length;
const palletOf = i => (S.scans[i] || []).map(s => s.pallet).join(', ');
const orderDone = o => S.rows.every((r, i) => r[S.orderCol] !== o || isDone(i));

// result card lives on the Scan tab; on other tabs the message also pops up as a toast
let toastT;
function show(cls, text) {
  $('result').className = cls; $('result').textContent = text;
  if (tab !== 'scan' && text) { $('toast').textContent = text; $('toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('toast').hidden = true, 3500); }
}
const qtyOf = i => Number(S.rows[i][S.qtyCol]) || 1;
// what you need to see on a scan: part · BN/SN · qty · T order + pos
function describe(lines) {
  const r = S.rows[lines[0]], order = S.orderCol ? r[S.orderCol] : '';
  const where = S.posCol ? `${order} pos ${lines.map(h => S.rows[h][S.posCol]).join(', ')}` : `line ${lines.map(h => h + 1).join(', ')}`;
  const bn = S.altCol && r[S.altCol] ? ` · BN/SN ${r[S.altCol]}` : '';
  return `${r[S.partCol]}${bn} · qty ${lines.reduce((a, h) => a + qtyOf(h), 0)} · ${where}`;
}
let pending = null; // lines waiting for a qty confirmation

function tick(lines, pallet) {
  lines.forEach(h => { S.scans[h] = [{ pallet, n: 1 }]; });
  const order = S.orderCol ? S.rows[lines[0]][S.orderCol] : '';
  const msg = `✓ ${describe(lines)} · pallet ${pallet}`;
  if (order && orderDone(order)) {
    const n = S.rows.filter(r => r[S.orderCol] === order).length;
    show('ok done', `✓ ORDER ${order} COMPLETE · all ${n} lines scanned\n${msg}`);
    try { navigator.vibrate?.([300, 150, 300]); } catch {}
  } else {
    show('ok', msg);
    try { navigator.vibrate?.(80); } catch {}
  }
  save(); render();
}

function handle(code) {
  code = String(code).trim();
  if (!code) return;
  // a qty confirmation is open: don't let the next scan slip past it
  if (pending) { $('raw').textContent = `⏸ Confirm or cancel the quantity first (${code} not checked)`; try { navigator.vibrate?.([60, 60, 60]); } catch {} return; }
  const hits = findRows(code);
  const pallet = $('pallet').value.trim() || '(none)';
  $('fix').innerHTML = '';
  if (!hits.length) {
    show('bad', `✗ ${code}: not on order (ignored)`);
  } else if (hits.every(isDone)) {
    const i = hits.find(h => palletOf(h) !== pallet) ?? hits[0];
    show('over', `⚠ Already scanned: ${describe([i])} · pallet ${palletOf(i)}`);
    // wrong pallet? re-scan with the right pallet set, then move the whole batch group in one tap
    if (palletOf(i) !== pallet) {
      const group = hits.filter(h => !S.orderCol || S.rows[h][S.orderCol] === S.rows[i][S.orderCol]);
      $('fix').innerHTML = `<button class="primary big" id="moveBtn">Move to pallet ${esc(pallet)}</button>`;
      $('moveBtn').onclick = () => {
        group.forEach(h => { S.scans[h] = [{ pallet, n: 1 }]; });
        $('fix').innerHTML = '';
        show('ok', `✓ Moved ${S.rows[i][S.partCol]} to pallet ${pallet}`);
        save(); render();
      };
    }
  } else {
    // same part no. on several lines: take the first line not yet scanned
    const i = hits.find(h => !isDone(h));
    const order = S.orderCol ? S.rows[i][S.orderCol] : '';
    // one batch label covers every line of that batch in the same T order; another T order needs its own scan
    const lines = hits.byBatch ? hits.filter(h => !isDone(h) && (!S.orderCol || S.rows[h][S.orderCol] === order)) : [i];
    return checkLines(lines, pallet);
  }
  try { navigator.vibrate?.(hits.length ? 80 : [200, 100, 200]); } catch {}
  save(); render();
}

function checkLines(lines, pallet) {
  const qty = lines.reduce((a, h) => a + qtyOf(h), 0);
  if (qty <= 1) return tick(lines, pallet);
  // more than one piece: tick only after you confirm they're all there
  pending = lines;
  show('over', `? ${describe(lines)} · pallet ${pallet}\nAre all ${qty} pcs there?`);
  $('fix').innerHTML = `<button class="primary big" id="qtyOk">Confirm ${qty} pcs</button><button id="qtyNo">Cancel</button>`;
  $('qtyOk').onclick = () => { pending = null; $('fix').innerHTML = ''; tick(lines, pallet); };
  $('qtyNo').onclick = () => { pending = null; $('fix').innerHTML = ''; show('', `Not checked: ${describe(lines)}`); };
  try { navigator.vibrate?.([80, 80, 80]); } catch {}
}

// Pallet size and weight, stored with the order: S.pallets[pallet] = { l, w, h, kg } (cm, kg)

function render() {
  const fill = (sel, val) => { sel.innerHTML = S.headers.map(h => `<option${h === val ? ' selected' : ''}>${esc(h)}</option>`).join(''); };

  const desc = S.headers.find(h => /desc/i.test(h));

  const extra = S.headers.filter(h => ![S.orderCol, S.posCol, S.partCol, S.altCol, S.labelCol, S.qtyCol, desc].includes(h)
    && S.rows.length > 1 && new Set(S.rows.map(r => String(r[h]).trim())).size > 1);
  const q = norm($('find').value), flt = document.querySelector('[name=flt]:checked').value;

    // search: any column or the pallet contains the text (dashes, spaces, dots ignored)
    if (q && ![...Object.values(r), palletOf(i)].some(v => norm(v).includes(q))) return '';
    if ((flt === 'todo' && d) || (flt === 'done' && !d)) return '';
    shownRows++;
    const info = [S.orderCol || S.posCol ? `${S.orderCol ? r[S.orderCol] : ''} pos ${S.posCol ? r[S.posCol] : i + 1}` : `line ${i + 1}`,

  const orders = S.orderCol ? [...new Set(S.rows.map(r => r[S.orderCol]))] : [];
  $('orders').innerHTML = orders.map(o => {
    const idx = S.rows.map((r, i) => i).filter(i => S.rows[i][S.orderCol] === o);
    const d = idx.filter(isDone).length;

  updDimBtn();

}

    .map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k.trim(), String(v).trim()])));

}).catch(() => { try { H = JSON.parse(localStorage.getItem('scanHistory')) || []; } catch {} }).then(() => render());

const doneOf = o => o.rows.filter((r, i) => o.scans[i]?.length).length;

  const row = (o, btns) => {

    return `<div class="card hrow${left ? '' : ' ok'}"><span><b>${esc(o.name || 'Order loaded earlier')}</b><br><span class="hint">${esc(when)} · ${d}/${o.rows.length} scanned${left ? ` · <b>${left} not scanned</b>` : ' · complete'}</span></span>${btns}</div>`;
  };

// ask Chrome not to delete this app's saved scans when the phone runs low on storage

// Pallets in natural order (1, 2, 10 — not 1, 10, 2)
const byNum = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
const palletList = () => [...new Set(S.rows.flatMap((r, i) => isDone(i) ? [palletOf(i)] : []))].sort(byNum);

$('printAll').onclick = () => printPallets(palletList());

// Live camera: Chrome's built-in BarcodeDetector reads the whole video frame ~8×/s.
// The same code is ignored for 3 s so one label isn't counted over and over.
let stream = null, track = null, frames = 0, lastCode = '', lastAt = 0;
const camId = () => { try { return localStorage.getItem('camId') || ''; } catch { return ''; } };
function stopCam() {
  stream?.getTracks().forEach(t => t.stop()); stream = track = null;
  $('live').hidden = true; $('camTools').hidden = true; $('zoomBox').hidden = true; $('camInfo').textContent = ''; $('liveBtn').textContent = 'Start camera';
}
async function startCam() {
  if (!('BarcodeDetector' in window)) return show('bad', 'This browser has no built-in barcode reader. Use Chrome on Android, or Photo scan.');
  const id = camId();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      ...(id ? { deviceId: { exact: id } } : { facingMode: { ideal: 'environment' } }), width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (err) {
    if (id) { try { localStorage.removeItem('camId'); } catch {} }
    return show('bad', `Camera did not start: ${err.message}. Allow camera access for this site in Chrome settings.`);
  }
  track = stream.getVideoTracks()[0];
  $('vid').srcObject = stream; await $('vid').play();
  $('live').hidden = false; $('camTools').hidden = false; $('liveBtn').textContent = 'Stop camera';
  const caps = track.getCapabilities?.() || {};
  try { if (caps.focusMode?.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
  // many Androids reach the 0.6 lens by zooming below 1×, not as a separate camera
  $('zoomBox').hidden = !caps.zoom;
  if (caps.zoom) Object.assign($('zoom'), { min: caps.zoom.min, max: Math.min(caps.zoom.max, 5), step: caps.zoom.step || 0.1, value: track.getSettings().zoom ?? 1 });
  $('zoomVal').textContent = `${(+$('zoom').value).toFixed(1)}×`;
  // camera names are only readable after permission is granted, so fill the picker now
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const running = track.getSettings().deviceId;
  $('camSel').innerHTML = cams.map((c, n) => `<option value="${esc(c.deviceId)}"${c.deviceId === running ? ' selected' : ''}>${esc(c.label || 'Camera ' + (n + 1))}</option>`).join('');
  frames = 0; scanLoop(new BarcodeDetector(), caps);
}
async function scanLoop(det, caps) {
  if (!stream) return;
  try {
    const codes = (await det.detect($('vid'))).map(b => b.rawValue);
    const code = codes.find(c => findRows(c).length) ?? codes[0];
    if (code && !(code === lastCode && Date.now() - lastAt < 3000)) { lastCode = code; lastAt = Date.now(); showRaw(codes); handle(code); }
  } catch {}
  frames++;
  const s = track?.getSettings() || {};
  $('camInfo').textContent = `${track?.label || 'camera'} · ${s.width}×${s.height} · zoom ${caps.zoom ? `${caps.zoom.min}–${caps.zoom.max}` : 'not adjustable'} · frames checked ${frames}`;
  setTimeout(() => scanLoop(det, caps), 120);
}
$('liveBtn').onclick = () => stream ? stopCam() : startCam();
$('camSel').onchange = e => { try { localStorage.setItem('camId', e.target.value); } catch {} if (stream) { stopCam(); startCam(); } };
$('zoom').oninput = e => {
  $('zoomVal').textContent = `${(+e.target.value).toFixed(1)}×`;
  track?.applyConstraints({ advanced: [{ zoom: +e.target.value }] }).catch(() => {});
};
// Full-size phone photos (12 MP) defeat the decoder; try shrunk copies, most likely size first.
async function decodePhoto(f) {
  let img;
  try { img = await createImageBitmap(f); } catch { return []; }
  pageReader ??= new Html5Qrcode('reader', readerConfig());
  for (const max of [Infinity, 1920, 1280, 800]) {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    if ('BarcodeDetector' in window) {
      try { const r = (await new BarcodeDetector().detect(c)).map(b => b.rawValue); if (r.length) return r; } catch {}
    }
    try {
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
      return [await pageReader.scanFile(new File([blob], 'photo.jpg', { type: 'image/jpeg' }), false)];
    } catch {}
  }
  return [];
}
$('photo').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  show('', 'Reading barcode…'); showRaw([]);
  const codes = await decodePhoto(f);
  if (!codes.length) return show('bad', 'No barcode found. Get closer, keep it flat and in focus, and try again.');
  showRaw(codes);
  // a label can carry part, serial and qty codes: use the first that matches the order
  const hit = codes.find(c => findRows(c).length);
  handle(hit ?? codes[0]);
};

$('export').onclick = () => {
  const out = S.rows.map((r, i) => ({ ...r, Check: isDone(i) ? 'OK' : 'NOT SCANNED', Pallet: palletOf(i) }));
  const csv = XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(out));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'scan-results.csv'; a.click();
  show('ok', 'Saved scan-results.csv to Downloads.');
};

// Excel: "Pallet summary" (size, weight, total), "All pallets" (every line, no size/weight), then one sheet per pallet
const numOrBlank = v => v === '' || v == null ? '' : Number(v);
const dimCols = p => { const d = dimOf(p); return { 'Length cm': numOrBlank(d.l), 'Width cm': numOrBlank(d.w), 'Height cm': numOrBlank(d.h), 'Weight kg': numOrBlank(d.kg) }; };
$('palXlsx').onclick = () => {
  const list = palletList();
  if (!list.length) return show('bad', 'Nothing scanned yet, so there are no pallets to export.');
  const cols = palletCols();
  const summary = list.map(p => ({ Pallet: p, Lines: palletLines(p).length, ...dimCols(p) }));
  summary.push({ Pallet: 'Total', Lines: summary.reduce((a, r) => a + r.Lines, 0), 'Weight kg': summary.reduce((a, r) => a + (Number(r['Weight kg']) || 0), 0) });
  const sheet = (ps, withPallet) => XLSX.utils.json_to_sheet(ps.flatMap(p => palletLines(p).map(i =>
    ({ ...(withPallet ? { Pallet: p } : {}),...Object.fromEntries(cols.map(h => [h, S.rows[i][h]])) }))));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'Pallet summary');
  XLSX.utils.book_append_sheet(wb, sheet(list, true), 'All pallets');
  // sheet names: max 31 chars, no : \ / ? * [ ], unique
  const used = new Set(['Pallet summary', 'All pallets']);
  list.forEach(p => {
    let name = `Pallet ${p}`.replace(/[:\\\/?*\[\]]/g, '-').slice(0, 31);
    for (let n = 2; used.has(name); n++) name = `${name.slice(0, 27)} (${n})`;
    used.add(name); XLSX.utils.book_append_sheet(wb, sheet([p], false), name);
  });
  XLSX.writeFile(wb, 'pallet-lists.xlsx');
  show('ok', `Saved pallet-lists.xlsx (${list.length} pallets) to Downloads.`);
};

render();
</script>
